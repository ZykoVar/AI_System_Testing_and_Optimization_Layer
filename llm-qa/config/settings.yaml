# ============================================================
# llm-qa 全局测试设置
# 所有值均可在运行时通过 CLI 参数覆盖；阈值可被测试用例自行覆盖
# ============================================================

# 默认使用的 Provider（见 providers.yaml），测试用例可通过 ctx.client("openai") 显式指定
default_provider: mock

# 用例并发度：安全/功能用例可调高，性能用例建议单独控制
concurrency: 8

# 单个用例默认超时（秒）
timeout_per_test: 90

# 用例因基础设施错误（ERROR）自动重试次数；断言失败（FAIL）不重试
retries_on_error: 1

# 遇到 HIGH 及以上失败立即停止调度新用例
fail_fast: false

# 报告与证据输出目录（相对仓库根）
report_dir: reports
artifact_dir: artifacts

# 默认判定阈值（各套件可引用 settings.thresholds 或自行覆盖）
thresholds:
  judge_min_score: 7.0          # LLM-as-Judge 最低通过分（0-10）
  similarity_min: 0.75          # 文本相似度最低值（0-1）
  p95_latency_ms: 2000.0        # P95 端到端延迟上限
  p99_latency_ms: 5000.0        # P99 端到端延迟上限
  ttft_p95_ms: 1500.0           # 首 token 延迟 P95 上限
  cost_per_request_usd: 0.01    # 单请求成本上限
  max_tokens_per_request: 4096  # 单请求输出 token 上限
  max_agent_iterations: 8       # Agent 最大迭代轮数
