# ============================================================
# LLM Provider 接入配置
# - api_key_env: 从环境变量读取密钥（支持 ${ENV:默认值} 语法）
# - kind: mock | openai_compat | anthropic
# ============================================================

# 确定性 Mock Provider：CI 冒烟测试与离线开发默认使用，无任何外部依赖
mock:
  kind: mock
  model: mock-1

openai:
  kind: openai_compat
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  model: gpt-4o-mini
  timeout_seconds: 60
  max_retries: 2
  pricing:
    prompt_per_1m_usd: 0.15
    completion_per_1m_usd: 0.60

# DeepSeek（OpenAI 兼容协议）。base_url 见 https://api-docs.deepseek.com/
# model 可用 deepseek-v4-flash（便宜/快/支持工具调用）或 deepseek-v4-pro。
deepseek:
  kind: openai_compat
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  model: deepseek-v4-flash
  timeout_seconds: 120
  max_retries: 2
  pricing:
    prompt_per_1m_usd: 0.22      # 输入（cache miss，非高峰）；高峰为 0.44
    completion_per_1m_usd: 0.66  # 输出（非高峰）；高峰为 1.32

# 本地自托管 vLLM / Ollama 兼容端点（OpenAI 协议）
local_vllm:
  kind: openai_compat
  base_url: http://127.0.0.1:8000/v1
  model: qwen2.5-7b-instruct
  timeout_seconds: 120
  max_retries: 1

anthropic:
  kind: anthropic
  base_url: https://api.anthropic.com
  api_key_env: ANTHROPIC_API_KEY
  model: claude-3-5-sonnet-latest
  timeout_seconds: 60
  max_retries: 2

# 成熟工具替代点：LiteLLM 统一网关（100+ 模型/自动重试/成本核算）。
# 启用：pip install -e ".[ext]" 后取消注释；
# model 可用 "provider/model" 形式（如 openai/gpt-4o-mini、anthropic/claude-3-5-sonnet）。
# litellm:
#   kind: litellm
#   model: openai/gpt-4o-mini
#   api_key_env: OPENAI_API_KEY
