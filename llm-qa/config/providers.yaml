# ============================================================
# LLM Provider 接入配置
# - api_key_env: 从环境变量读取密钥（支持 ${ENV:默认值} 语法）
# - kind: mock | openai_compat | anthropic
# ============================================================

# 确定性 Mock Provider：CI 冒烟测试与离线开发默认使用，无任何外部依赖
mock:
  kind: mock
  model: mock-1

openai:
  kind: openai_compat
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  model: gpt-4o-mini
  timeout_seconds: 60
  max_retries: 2
  pricing:
    prompt_per_1m_usd: 0.15
    completion_per_1m_usd: 0.60

# 本地自托管 vLLM / Ollama 兼容端点（OpenAI 协议）
local_vllm:
  kind: openai_compat
  base_url: http://127.0.0.1:8000/v1
  model: qwen2.5-7b-instruct
  timeout_seconds: 120
  max_retries: 1

anthropic:
  kind: anthropic
  base_url: https://api.anthropic.com
  api_key_env: ANTHROPIC_API_KEY
  model: claude-3-5-sonnet-latest
  timeout_seconds: 60
  max_retries: 2
