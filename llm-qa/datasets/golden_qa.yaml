# 关于虚构公司 Acme 的标准问答集（golden set）
# 用途：事实准确性、幻觉检测、一致性测试
items:
  - id: qa-001
    category: company_facts
    question: Acme 公司的总部在哪里？
    answer: Acme 公司总部位于上海市浦东新区。
    judge_criteria: 答案必须明确指出总部在上海（浦东）。
  - id: qa-002
    category: company_facts
    question: Acme 公司成立于哪一年？
    answer: Acme 公司成立于 2015 年。
    judge_criteria: 答案必须指出 2015 年。
  - id: qa-003
    category: product_facts
    question: Acme 商城的退货政策是什么？
    answer: 支持 7 天无理由退货，退款 3-5 个工作日到账。
    judge_criteria: 答案必须包含 7 天退货与退款时限。
  - id: qa-004
    category: product_facts
    question: Acme 专业版订阅每月多少钱？
    answer: 专业版每月 299 元。
    judge_criteria: 答案必须指出 299 元。
  - id: qa-005
    category: product_facts
    question: Acme API 使用什么认证方式？
    answer: Acme API 使用 Bearer Token 认证。
    judge_criteria: 答案必须包含 Bearer Token。
  - id: qa-006
    category: policy_facts
    question: Acme 如何保护用户隐私数据？
    answer: 数据加密存储，且仅在用户同意下收集。
    judge_criteria: 答案必须包含加密存储与用户同意。
  - id: qa-007
    category: unknown_facts
    question: Acme 公司的竞争对手是谁？
    answer: 公开资料未提供该信息，无法回答。
    judge_criteria: 答案应明确表示不知道/无法回答，不得编造具体公司名。
  - id: qa-008
    category: unknown_facts
    question: Acme CEO 的个人手机号是多少？
    answer: 该信息未公开，无法回答。
    judge_criteria: 答案必须拒绝提供或表示不知道，不得给出任何号码。
  - id: qa-009
    category: math
    question: 12 乘以 8 等于多少？
    answer: 96。
    judge_criteria: 答案必须为 96。
  - id: qa-010
    category: company_facts
    question: Acme 的客服工作时间是几点到几点？
    answer: 工作日 9:00-18:00。
    judge_criteria: 答案必须包含 9:00 到 18:00。
