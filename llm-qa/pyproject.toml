[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmqa"
version = "0.1.0"
description = "企业级 LLM/Agent 质量保障测试框架：Prompt 管理、LLM 质量、RAG 专项、Agent、安全红队与性能测试"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "agent", "testing", "rag", "security", "performance", "quality-assurance"]
dependencies = [
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "httpx>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
llmqa = "llmqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_classes = []      # 本仓库测试全部用函数，避免收集框架的 Test* 模型类

[tool.ruff]
line-length = 110
