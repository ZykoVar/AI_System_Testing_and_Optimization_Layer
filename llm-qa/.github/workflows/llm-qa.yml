# LLM/Agent 质量门禁流水线（四层：静态 → 冒烟 → 全量 mock → 真实模型）
name: llm-qa

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *"      # 每夜 02:00 UTC 跑真实模型层
  workflow_dispatch:

jobs:
  # L0：静态门禁
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装
        run: |
          pip install -e ".[dev]"
      - name: 语法检查
        run: python -m compileall -q src tests examples
      - name: Prompt 契约校验
        run: llmqa prompts validate
      - name: Prompt 注入扫描
        run: llmqa prompts scan
      - name: 用例 id 唯一性 lint
        run: python scripts/lint_ids.py
      - name: 框架自测（pytest）
        run: pytest -q

  # L1：Mock 冒烟
  smoke:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装
        run: pip install -e .
      - name: Mock 冒烟（全套件 smoke 标签）
        run: llmqa run --tag smoke --no-color
      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports
          path: reports/

  # L2：全量 Mock 回归（仅 main 分支）
  full-mock:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装
        run: pip install -e .
      - name: 全量 Mock 回归
        run: llmqa run --no-color
      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: full-mock-reports
          path: reports/

  # L3：真实模型（每夜/手动；需要 OPENAI_API_KEY secret）
  nightly:
    runs-on: ubuntu-latest
    needs: static
    environment: real-llm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装
        run: pip install -e .
      - name: 真实模型（低并发控制成本）
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: llmqa run --provider openai --concurrency 2 --no-color
      - name: 严重级门禁（CRITICAL/HIGH 失败即拦截）
        run: python scripts/gate.py reports
      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: nightly-reports
          path: reports/
